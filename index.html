<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>心理健康衛教小鎮（名稱未定）</title>
  <style>
    :root { --ink: #4a3f38; --paper: #fbf6ee; --accent: #c98a6b; }
    html, body { margin: 0; height: 100%; background: #e9e1d4; overflow: hidden;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; color: var(--ink); }
    #game { width: 100%; height: 100%; }

    /* 「我需要幫忙」按鈕：依 AGENTS.md 第 5 節必須常駐，任何修改都不可移除 */
    #help-button { position: fixed; top: 12px; right: 12px; z-index: 1000; padding: 10px 16px;
      border: 2px solid #fff; border-radius: 999px; background: var(--accent); color: #fff;
      font: inherit; font-size: 16px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; }
    #help-button:focus-visible { outline: 3px solid #4a3f38; }
    #help-dialog { max-width: min(520px, 92vw); max-height: 85vh; border: none; border-radius: 16px;
      padding: 20px 22px; background: var(--paper); color: var(--ink); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    #help-dialog::backdrop { background: rgba(60, 50, 44, .45); }
    #help-dialog h2 { margin: 0 0 8px; font-size: 20px; }
    #help-dialog .emergency { background: #f6e1d6; border-radius: 10px; padding: 10px 12px; margin: 8px 0 14px; }
    #help-dialog ul { list-style: none; padding: 0; margin: 0; }
    #help-dialog li { border-bottom: 1px solid #e6dccd; padding: 10px 0; }
    #help-dialog .phone { font-size: 22px; font-weight: bold; color: var(--accent); text-decoration: none; }
    #help-dialog .meta { font-size: 13px; opacity: .75; }
    #help-dialog .pending { font-size: 12px; background: #efe2b8; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
    #help-close { margin-top: 14px; width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: var(--ink); color: #fff; font: inherit; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game"></div>

  <button id="help-button" type="button" aria-haspopup="dialog">我需要幫忙</button>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <h2 id="help-title">你不是一個人</h2>
    <p>想找人聊聊的時候，可以撥打以下專線。</p>
    <div class="emergency" id="help-emergency">如果你或身邊的人有立即的生命危險，請直接撥打 119（救護）或 110（報案）。</div>
    <!-- 備用清單：resources.json 讀取失敗時仍能顯示 -->
    <ul id="help-list">
      <li><a class="phone" href="tel:1925">1925</a> 安心專線</li>
      <li><a class="phone" href="tel:1995">1995</a> 生命線協談專線</li>
      <li><a class="phone" href="tel:1980">1980</a> 張老師專線</li>
    </ul>
    <button id="help-close" type="button">我知道了，回到小鎮</button>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/help.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
