<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>願望紀錄</title>
  <!-- 製作者用的「願望紀錄」頁：遊戲裡沒有任何入口或連結指向這裡。
       未登入時只顯示登入畫面；留言只有登入的製作者帳號讀得到（保護靠 Supabase 的登入與權限規則，不是靠網址沒人知道）。 -->
  <style>
    :root { --paper: #fffaf3; --ink: #3d322c; --ink-soft: #7a6b60; --line: #e6d8c6; --accent: #c97f62; --ok: #6f9f78; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f6ecdc; color: var(--ink); line-height: 1.6; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.3rem; margin: 8px 0 4px; }
    .card { background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }
    label { display: block; font-weight: 700; margin: 10px 0 4px; }
    input { width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; }
    button { font: inherit; border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .spacer { flex: 1; }
    .fine { font-size: .85rem; color: var(--ink-soft); }
    .notice { background: #fdf3c4; border-radius: 10px; padding: 8px 12px; }
    .hidden { display: none !important; }
    ul.wishes { list-style: none; padding: 0; margin: 0; }
    .wish { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
    .wish.unread { border-color: var(--accent); }
    .wish .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem; color: var(--ink-soft); }
    .wish .tag { border-radius: 999px; padding: 0 8px; font-size: .78rem; border: 1px solid currentColor; }
    .wish .unread-tag { color: var(--accent); }
    .wish .msg { white-space: pre-wrap; word-break: break-word; margin: 6px 0; font-size: 1.02rem; }
    .filters button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <h1>願望紀錄</h1>
    <p class="fine">許願池的留言。只有登入的製作者看得到；請不要轉貼或公開留言內容。</p>
    <p id="mode-note" class="notice hidden"></p>

    <section id="login" class="card hidden" aria-label="登入">
      <form id="login-form">
        <label for="email">製作者帳號（email）</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <p id="login-status" class="fine" role="status"></p>
        <div class="row"><button type="submit" class="primary">登入</button></div>
      </form>
    </section>

    <section id="board" class="hidden" aria-label="留言">
      <div class="row">
        <span id="who" class="fine"></span><span class="spacer"></span>
        <button type="button" id="reload">重新整理</button>
        <button type="button" id="export">匯出成檔案（CSV）</button>
        <button type="button" id="logout">登出</button>
      </div>
      <div class="row filters" role="group" aria-label="篩選">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="unread" aria-pressed="false">未讀</button>
        <span id="count" class="fine"></span>
      </div>
      <p id="board-status" class="fine" role="status"></p>
      <ul id="wishes" class="wishes"></ul>
    </section>
  </main>
  <script type="module" src="src/wishes-admin.js"></script>
</body>
</html>
